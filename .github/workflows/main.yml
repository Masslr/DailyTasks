name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller PyQt6

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name TasksTray main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TasksTray
          path: dist/TasksTray.exe
